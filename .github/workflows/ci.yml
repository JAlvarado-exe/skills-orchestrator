name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Catalog is in sync
        run: python scripts/render_catalog.py --check
      - name: English only
        run: python scripts/check_english.py
      - name: No machine-specific paths or emails
        run: python scripts/check_privacy.py
      - name: Self scan checks that merging lost no SKILL.md
        run: python -m orchestrator scan --root skills::self --check
